  T3: >-
    Pass. Correct, fully supported, and it uses both sources: the job title from the original experience entry [S5] and
    its note [S3]; "70%" from the Action Hub page's front matter [S1] and outcome table [S6] and its note [S4].
  T4: >-
    Pass. The expected refusal, without guessing, from the same Pac-Man passages the local model saw.

