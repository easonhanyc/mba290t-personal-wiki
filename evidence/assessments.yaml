    the 20%: the original Attendance [S1] and Grading [S2] sections and two blocks of the reviewed syllabus note [S3]
    [S5]. "One session without penalty" is in S1 and S2.
  T2: >-
    Pass, but incomplete. Same gap as the local model, on the same passages. Every claim is supported: Row Level
    Security with each contact owned by exactly one account [S1][S2]; Postgres reads the user id from a short-lived
    JWT so a query for all contacts cannot return another user's rows [S4]; PATCH/DELETE on someone else's contact
